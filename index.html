<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Fan war for Indian cinema. Most tickets wins. Tickets are free.">
<meta property="og:title" content="cutout.lol — fight for your hero">
<meta property="og:description" content="Most tickets wins. Tickets are free. Tonight's battle ends at midnight.">
<meta name="theme-color" content="#140a0e">
<title>cutout.lol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Bungee+Inline&family=Mukta:wght@400;600;800&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
/* Layout: one dark cinema-hall world. Sticky fan bar (wallet, rank, meals, sound). Home: meals hero, live clashes rail, tabs, sticker grid. Profile #p-x: stage with ritual FX + theatre with screen takeover, seat booking, celebrations, fan board, power, merch. Clash #c-x: arena, locked sides, final-hour 2x, taunt wall. */
:root{
  --hall:#170a0d; --hall-2:#22111a; --hall-3:#2e1823; --line:#4a2a37;
  --paper:#fff4e2; --muted:#c9a9b4; --marigold:#ffb31f; --pink:#ff4f8b; --good:#4fe0a1;
  --f-display:"Bungee","Impact","Arial Black",sans-serif;
  --f-inline:"Bungee Inline","Bungee","Impact",sans-serif;
  --f-body:"Mukta","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--hall);color:var(--paper)}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 90px;
  background:radial-gradient(ellipse 80% 40% at 50% 0%,#3a1220 0%,transparent 70%),radial-gradient(circle at 1px 1px,#ffffff0a 1px,transparent 1.4px) 0 0/14px 14px,var(--hall);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hall)}
.wrap{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--marigold);outline-offset:2px}
.muted{color:var(--muted)}

/* figurines */
.fig{display:block;width:100%;height:100%;overflow:visible}
.sticker{filter:drop-shadow(2px 0 0 #fff4e2) drop-shadow(-2px 0 0 #fff4e2) drop-shadow(0 2px 0 #fff4e2) drop-shadow(0 -2px 0 #fff4e2) drop-shadow(0 7px 6px #0009)}
.fig .bob{animation:bob 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.fig .eyes{animation:blink 5.5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(-3px) scaleY(1.02)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.cheer .fig .bob{animation:cheer .55s cubic-bezier(.3,1.8,.5,1) 2}
@keyframes cheer{40%{transform:translateY(-16px) rotate(-4deg) scale(1.06)}}
.dance .fig .bob{animation:dance .3s ease-in-out 8}
@keyframes dance{25%{transform:rotate(-9deg) translateY(-6px)}75%{transform:rotate(9deg) translateY(-6px)}}
.wet .fig{filter:brightness(1.12) saturate(.85)}

/* ticker + fan bar */
.ticker{display:flex;margin-top:10px;border-radius:10px;overflow:hidden;background:var(--paper);color:#2a0d16;font-weight:700}
.ticker .tag{flex:none;background:var(--pink);color:#fff;font-family:var(--f-display);padding:8px 12px;font-size:14px;display:flex;align-items:center}
.ticker .track{flex:1;min-width:0;overflow:hidden}
.ticker .run{display:inline-flex;gap:48px;white-space:nowrap;padding:8px 0;animation:run 80s linear infinite;font-size:15px}
.ticker .run span::before{content:"●";color:var(--pink);margin-right:10px;font-size:10px;vertical-align:middle}
@keyframes run{to{transform:translateX(-50%)}}
.fanbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 0;background:var(--hall)}
.logo{font-family:var(--f-inline);font-size:clamp(26px,5vw,40px);line-height:1;color:var(--marigold);text-shadow:3px 3px 0 #8a1f3d;text-decoration:none}
.logo span{color:var(--pink)}
.mebox{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.me{display:flex;align-items:center;gap:10px;background:var(--hall-2);border:1px solid var(--line);border-radius:999px;padding:4px 14px 4px 4px;min-width:0}
.me .av{width:36px;height:42px;flex:none}
.me .who{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.me .who b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .who span{font-size:12px;color:var(--marigold);font-weight:700}
.xpbar{width:110px;height:6px;border-radius:99px;background:#ffffff14;overflow:hidden;margin-top:3px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--marigold),var(--pink));transition:width .5s}
.wallet{display:flex;align-items:center;gap:8px;border:2px solid var(--marigold);background:#ffb31f1a;border-radius:999px;padding:6px 12px;font-family:var(--f-display);font-size:15px;color:var(--marigold)}
.wallet small{font-family:var(--f-body);font-weight:800;font-size:12px;background:var(--marigold);color:var(--hall);border-radius:999px;padding:1px 8px}
.wallet.pulse{animation:wpulse .5s}
@keyframes wpulse{40%{transform:scale(1.15)}}
.pill{border:1px solid var(--line);background:var(--hall-2);border-radius:999px;padding:6px 10px;font-size:13px;font-weight:800}
.signin{border:0;border-radius:999px;padding:10px 18px;font-family:var(--f-display);font-size:14px;background:var(--marigold);color:var(--hall);box-shadow:0 4px 0 #a8650a}

.hello{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:end}
@media (max-width:760px){.hello{grid-template-columns:minmax(0,1fr)}}
.hello>*{min-width:0}
.hello h1{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,4.4vw,42px);line-height:1.05;margin:0;text-wrap:balance;overflow-wrap:break-word;white-space:normal}
.hello h1 em{font-style:normal;color:var(--marigold)}
.meals{border-radius:18px;padding:14px 16px;background:linear-gradient(135deg,#123d2c,#0f2a20);border:2px solid #2f9e6a}
.meals .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9be8c4}
.meals b{display:block;font-family:var(--f-display);font-weight:400;font-size:clamp(26px,4vw,36px);color:var(--good);font-variant-numeric:tabular-nums}
.meals p{margin:2px 0 0;font-size:13px;color:#c8efdc}
.demo{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sech{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sech h2{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0}
.live{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px;color:var(--pink);text-transform:uppercase;letter-spacing:.12em}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pink);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.3}}

.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(280px,1fr);gap:14px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory}
.ccard{scroll-snap-align:start;display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:18px;background:linear-gradient(180deg,#2b0f19,#1c0a10);border:2px solid #5c2a3a;text-decoration:none}
.ccard:hover{border-color:var(--marigold)}
.ccard .ctype{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ccard .ctype b{color:var(--marigold);font-weight:700}
.ccard .x2{font-family:var(--f-display);font-size:12px;color:var(--hall);background:var(--good);border-radius:6px;padding:2px 8px;align-self:flex-start}
.ccard .duo{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:6px;text-align:center}
.ccard .duo .f{width:78px;height:100px;margin:0 auto}
.ccard .duo .n{font-family:var(--f-display);font-size:13px;line-height:1.1;overflow-wrap:anywhere}
.ccard .vsx{font-family:var(--f-inline);font-size:28px;color:var(--pink)}
.split{display:flex;height:12px;border-radius:99px;overflow:hidden;border:2px solid var(--paper)}
.split i{display:block;height:100%;transition:width .5s}
.ccard .foot{display:flex;justify-content:space-between;font-size:13px;font-weight:700;gap:8px}
.ccard .join{text-align:center;border-radius:999px;padding:7px;background:var(--marigold);color:var(--hall);font-family:var(--f-display);font-size:13px}

.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.tab{flex:none;border:2px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-weight:800;color:var(--muted)}
.tab[aria-pressed="true"]{background:var(--paper);color:var(--hall);border-color:var(--paper)}
.search{width:100%;background:var(--hall-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px;list-style:none;margin:0;padding:0}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:14px 10px 12px;border-radius:18px;background:var(--hall-2);border:2px solid var(--line);text-align:center;text-decoration:none;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-4px) rotate(-1deg);border-color:var(--c)}
.card.bump{animation:bumpc .6s}
@keyframes bumpc{30%{box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 45%,transparent)}}
.card .rk{position:absolute;left:10px;top:8px;font-family:var(--f-display);font-size:18px;color:var(--muted)}
.card .rk.r1{color:var(--marigold)}
.card .f{width:100px;height:130px}
.card .cname{font-family:var(--f-display);font-size:14px;line-height:1.15;color:var(--c);overflow-wrap:anywhere;margin-top:4px}
.card .ctag{font-size:12px;color:var(--muted)}
.card .cp{font-weight:800}
.card .fed{font-size:12px;color:var(--good);font-weight:700}
.mini{width:100%;height:6px;border-radius:99px;background:#ffffff12;overflow:hidden;margin-top:4px}
.mini i{display:block;height:100%;background:var(--c)}
.more{width:100%;border:1px dashed var(--line);background:transparent;border-radius:10px;padding:9px;font-weight:700;color:var(--muted)}

.panel{background:var(--hall-2);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.panel h2{font-family:var(--f-display);font-weight:400;font-size:18px;margin:0 0 4px}
.panel .sub{color:var(--muted);font-size:14px;margin:0 0 12px}
.feed{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.feed li{display:grid;grid-template-columns:10px minmax(0,1fr);gap:10px;font-size:14px;padding:8px 10px;border-radius:10px;background:var(--hall-3);animation:slide .4s ease-out}
.feed li.mine{outline:2px solid var(--marigold)}
.feed .dot{width:10px;height:10px;border-radius:50%;background:var(--c);margin-top:6px}
.feed em{font-style:normal;color:var(--muted)}
.feed strong{color:var(--c)}
@keyframes slide{from{opacity:.2;transform:translateY(-8px)}}

/* profile */
.back{align-self:flex-start;text-decoration:none;font-weight:800;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.4fr);gap:20px;align-items:start}
.two.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:880px){.two,.two.even{grid-template-columns:minmax(0,1fr)}}
.stage{position:relative;contain:paint;border-radius:22px;padding:20px;text-align:center;background:radial-gradient(ellipse at 50% 35%,color-mix(in srgb,var(--c) 45%,transparent),transparent 65%),var(--hall-2);border:2px solid var(--line);overflow:hidden}
.stage .rays{position:absolute;inset:-40%;background:repeating-conic-gradient(from 0deg,#ffffff08 0 10deg,transparent 10deg 20deg);animation:spin 40s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(1turn)}}
.stage .f{position:relative;width:min(230px,58vw);aspect-ratio:100/130;margin:0 auto}
.stage .pname{position:relative;font-family:var(--f-inline);font-size:clamp(28px,5vw,44px);line-height:1;color:var(--c);margin:12px 0 4px;text-wrap:balance}
.stage .pnick{position:relative;font-weight:800}
.chips{position:relative;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.chip{border-radius:999px;padding:5px 12px;font-weight:800;font-size:13px;background:var(--hall-3);border:1px solid var(--line)}
.chip.hl{background:var(--marigold);color:var(--hall);border-color:var(--marigold)}
.chip.food{background:#123d2c;border-color:#2f9e6a;color:var(--good)}
.fxl{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden;border-radius:inherit}
.poptxt{position:absolute;left:50%;top:18%;transform:translate(-50%,-50%);font-family:var(--f-inline);font-size:clamp(28px,6vw,46px);color:var(--marigold);text-shadow:3px 3px 0 #8a1f3d,0 0 20px #000;white-space:nowrap}
.theatre-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.theatre-top .pct{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
#theatreBox{position:relative}
.hall-svg{width:100%;height:auto;display:block;margin-top:8px}
.stamp{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%) rotate(-10deg);font-family:var(--f-display);font-size:clamp(22px,5vw,40px);color:var(--pink);border:5px solid var(--pink);border-radius:10px;padding:4px 14px;background:#170a0dcc;white-space:nowrap;pointer-events:none}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.note{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--hall-3);font-size:14px}
.note b{color:var(--marigold)}
.takeover{margin-top:10px;width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;text-align:left;border:2px solid var(--pink);background:#ff4f8b1a;border-radius:12px;padding:10px 12px}
.takeover b{font-weight:800}
.takeover span{font-size:13px;color:var(--muted)}
.takeover .cost{grid-row:span 2;font-family:var(--f-display);color:var(--pink)}
.book{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bk{position:relative;display:flex;flex-direction:column;gap:2px;text-align:left;border:2px solid var(--line);background:var(--hall-3);border-radius:14px;padding:12px}
.bk:hover{border-color:var(--marigold)}
.bk b{font-family:var(--f-display);font-weight:400;font-size:18px}
.bk span{font-size:13px;color:var(--muted)}
.bk em{font-style:normal;font-size:12px;font-weight:800;color:var(--good)}
.bk .tagx{position:absolute;right:8px;top:-9px;font-size:11px;font-weight:800;background:var(--pink);color:#fff;border-radius:6px;padding:1px 6px}
.rituals{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.rt{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:2px dashed var(--line);background:var(--hall-3);border-radius:14px;padding:10px 12px}
.rt:hover{border-style:solid;border-color:var(--marigold)}
.rt .ico{width:40px;height:40px}
.rt b{font-weight:800;line-height:1.15}
.rt span{font-size:12px;color:var(--muted)}
.rt .c{font-family:var(--f-display);font-size:14px;color:var(--marigold)}
.power{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.power li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:14px}
.power .pb{grid-column:1/-1;height:8px;border-radius:99px;background:#ffffff10;overflow:hidden}
.power .pb i{display:block;height:100%;background:var(--c)}
.power small{display:block;color:var(--muted);font-size:12px}
.power b{font-family:var(--f-mono)}
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.board li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;background:var(--hall-3);font-size:14px}
.board li.you{background:color-mix(in srgb,var(--marigold) 22%,var(--hall-3));outline:2px solid var(--marigold)}
.board li.gold span:nth-child(2){color:#ffd43b}
.board .n{font-family:var(--f-display);color:var(--muted);text-align:center}
.board li:nth-child(1) .n{color:#ffd43b}.board li:nth-child(2) .n{color:#dee2e6}.board li:nth-child(3) .n{color:#e8a26a}
.board .t{display:block;font-size:12px;color:var(--muted)}
.board .x{font-family:var(--f-mono);font-weight:700}
.board .gap{text-align:center;color:var(--muted);font-size:12px;background:none;padding:0}
.prize{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:#ffb31f14;border:1px dashed var(--marigold);font-size:13px;margin-bottom:10px}
.share{display:flex;flex-direction:column;gap:10px}
.sharebtn{display:grid;gap:2px;text-align:left;border:1px solid var(--line);background:var(--hall-3);border-radius:12px;padding:10px 12px}
.sharebtn b{font-weight:800}
.sharebtn span{font-size:13px;color:var(--muted)}
.sharebtn em{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--good)}
.rival{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center;padding:10px;border-radius:12px;background:var(--hall-3);text-decoration:none}
.rival .f{width:64px;height:84px}
.rival b{color:var(--c)}
.merch{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;align-items:center}
.merch .f{width:110px;height:140px}
.merch .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.merch button{border:2px solid var(--marigold);background:transparent;border-radius:10px;padding:8px 12px;font-weight:800;color:var(--marigold)}

/* clash */
.arena{position:relative;border-radius:22px;padding:20px;background:linear-gradient(180deg,#2b0f19,#1c0a10);border:2px solid #5c2a3a;overflow:hidden}
.bulbs{position:absolute;inset:8px;border-radius:14px;pointer-events:none;background:radial-gradient(circle,var(--marigold) 2.4px,transparent 3.2px) 0 0/22px 22px repeat-x,radial-gradient(circle,var(--marigold) 2.4px,transparent 3.2px) 0 100%/22px 22px repeat-x;animation:chase 1.2s steps(2) infinite;opacity:.85}
@keyframes chase{50%{background-position:11px 0,11px 100%}}
.ahead{text-align:center;margin-top:8px}
.ahead .t{font-family:var(--f-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.ahead h1{font-family:var(--f-inline);font-weight:400;font-size:clamp(26px,5.5vw,52px);line-height:1;margin:6px 0;color:var(--marigold);text-wrap:balance}
.timer{font-family:var(--f-display);font-size:18px;color:var(--pink)}
.finalhr{display:inline-block;margin-top:8px;font-family:var(--f-display);font-size:14px;color:var(--hall);background:var(--good);border-radius:8px;padding:4px 10px;animation:pulse 1s infinite}
.fighters{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;margin-top:10px}
.fighter{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0;text-decoration:none;border-radius:16px}
.fighter .f{width:min(170px,34vw);aspect-ratio:100/130}
.fighter .fname{font-family:var(--f-display);font-size:clamp(14px,2.6vw,22px);line-height:1.1;color:var(--c);overflow-wrap:anywhere}
.fighter .fp{font-weight:800}
.vsword{font-family:var(--f-inline);font-size:clamp(40px,9vw,90px);color:var(--pink);transform:rotate(-8deg);text-shadow:4px 4px 0 #000}
.tug{display:flex;height:18px;border-radius:99px;overflow:hidden;margin:14px 0 6px;border:2px solid var(--paper)}
.tug i{display:block;height:100%;transition:width .5s}
.tugl{display:flex;justify-content:space-between;font-family:var(--f-display);font-size:16px}
.pickside{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:14px}

function tone(f1,f2,dur,type="sine",vol=.06,at=0){const a=A();if(!a)return;const t=a.currentTime+at,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02);}

    cx.save();cx.globalAlpha=p.fade?Math.max(0,1-p.life/p.max):1;cx.translate(p.x*d,p.y*d);cx.rotate(p.rot);cx.fillStyle=p.c;

  $("#view").innerHTML=`<section class="panel"><h2>Ticket review · ${(rows||[]).length} pending</h2>${(rows||[]).map(r=>`<div class="rev-row" style="display:grid;grid-template-columns:160px 1fr;gap:14px;padding:12px 0;border-top:1px solid #ffffff14"><a href="${urls[r.id]}" target="_blank" rel="noopener"><img src="${urls[r.id]}" alt="Ticket" style="width:160px;border-radius:8px"></a><div><b>${esc((E(r.entity_id)||{}).name||r.entity_id)}</b> · ${r.first_day?"First day (+20)":"+10"}<br><small class="muted">${new Date(r.created_at).toLocaleString("en-IN")}</small><div class="row" style="margin-top:8px"><button class="primary" data-review="${r.id}" data-ok="1">Approve</button> <button class="ghost" data-review="${r.id}" data-ok="0">Reject</button></div></div></div>`).join("")||"<p>Nothing to review.</p>"}</section>`;}
/* ======================= INIT ======================= */
if(!S.headlines.length){const t=tonightRank();S.headlines=[`${t[0].name} leads tonight's battle.`,ROASTS[0](t[1].name,t[2].name),`${E("pushpa-2").name} and ${E("kgf-chapter-2").name} fans are trading tickets again.`,ROASTS[5](t[3].name,t[4].name),"Upload your movie ticket for +20 on first day."];}
if(!LIVE){renderTicker();renderMe();render();}else{renderMe();$("#view").innerHTML=`<p class="muted" style="text-align:center;padding:80px 0">Loading tonight's battle…</p>`;}

if(!LIVE)setInterval(bot,1700);else liveBoot();
})();

</script>
